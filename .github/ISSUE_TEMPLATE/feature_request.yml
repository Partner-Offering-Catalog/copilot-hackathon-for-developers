name: Feature request
description: Suggest an outcome that would improve the product
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include constraints, dependencies, alternatives, or mockups.
